name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.3.1

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download verified FFmpeg 9.0.2
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip"
          $expectedHash = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-9.0.2-essentials_build.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "FFmpeg checksum mismatch: $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $expanded
          $ffmpeg = Get-ChildItem $expanded -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $expanded -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg package is incomplete." }
          $destination = Join-Path $PWD "vendor/ffmpeg/win-x64"
          New-Item $destination -ItemType Directory -Force | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $destination "ffmpeg.exe")
          Copy-Item $ffprobe.FullName (Join-Path $destination "ffprobe.exe")
          @"
          FFmpeg 9.0.2 essentials build for Windows x64
          Source: $url
          Archive SHA-256: $expectedHash
          Build provider: https://www.gyan.dev/ffmpeg/builds/
          FFmpeg source: https://github.com/FFmpeg/FFmpeg/tree/n9.0.2
          License: GPLv3; see https://www.gnu.org/licenses/gpl-3.0.html
          "@ | Set-Content (Join-Path $destination "FFMPEG-SOURCE.txt")

      - name: Run automated tests including real FFmpeg export
        shell: pwsh
        run: |
          $env:VBP_TEST_FFMPEG = Join-Path $PWD "vendor/ffmpeg/win-x64/ffmpeg.exe"
          dotnet test tests/VideoBatchProcessor.Tests/VideoBatchProcessor.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Automated tests failed." }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          $directory = "C:\Program Files (x86)\Inno Setup 6"
          $compiler = Join-Path $directory "ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler." }
          Add-Content $env:GITHUB_PATH $directory

      - name: Build self-contained Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ inputs.version }}"

      - name: Ensure Microsoft WebView2 Runtime is installed
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList "/silent", "/install" -PassThru -Wait
          if ($install.ExitCode -ne 0) {
              throw "WebView2 Runtime installer failed with code $($install.ExitCode)."
          }

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "artifacts/release/${{ inputs.version }}/win-x64/VideoBatchProcessor-${{ inputs.version }}-win-x64-setup.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "VideoBatchProcessor-installed"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDirectory`"" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $app = Join-Path $installDirectory "VideoBatchProcessor.exe"
          if (-not (Test-Path $app)) { throw "Installer did not create the application." }
          $started = Get-Date
          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
              Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = $started } -ErrorAction SilentlyContinue |
                  Where-Object { $_.ProviderName -in ".NET Runtime", "Application Error" } |
                  Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
                  Format-List |
                  Out-String |
                  Write-Host
              throw "Packaged application exited during the launch smoke test (code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Join-Path $installDirectory "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Installer did not create an uninstaller." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $installDirectory)) { throw "Uninstaller did not finish cleanly." }

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: VideoBatchProcessor-${{ inputs.version }}-win-x64
          path: |
            artifacts/release/${{ inputs.version }}/win-x64/VideoBatchProcessor-${{ inputs.version }}-win-x64-setup.exe
            artifacts/release/${{ inputs.version }}/win-x64/VideoBatchProcessor-${{ inputs.version }}-win-x64-setup.exe.sha256
          if-no-files-found: error
